openapi: 3.1.0
info:
  title: WordPlus Cloud realtime HTTP API
  version: "1"
  summary: What your server calls on WordPlus Cloud, and the webhook it gets back.
  description: |
    Your server sends events to rooms and users, and asks the pages of a user and waits for their replies. It reads the
    rooms someone is in, who is in each and its history, who is online, the group calls and live streams going on and
    who is in them, what your app uses, and the deliveries of its webhook. It takes a user out of everything at once,
    takes people out of rooms, calls and streams, mutes and ends calls, and moderates the chat of a stream as its
    moderators do. All with signed HTTPS requests. WordPlus Cloud tells your server what happens with a signed webhook.

    The packages for Node (`@wordplus/realtime`), PHP (`wordplus/realtime-php`) and Python (`wordplus-realtime`) make
    these requests for you. From any other language, sign them as [signing requests](/api/signing/) shows. Every
    request carries three headers: `X-WordPlus-Site` (your app key), `X-WordPlus-Timestamp` (unix seconds) and
    `X-WordPlus-Signature`.

    The examples use a helper that signs and sends a request, `wordplus( method, path, body )`, the same in every
    language, given in full on [signing requests](/api/signing/).
  contact:
    url: https://www.wordplus.cloud/contact
servers:
  - url: https://rest.wordplus.cloud
    description: WordPlus Cloud
security:
  - site: []
    timestamp: []
    signature: []
tags:
  - name: Events
    description: Send events to rooms and to users, one at a time or in batches.
  - name: Rooms
    description: The rooms someone is in, how many are in a room and who, its history, and taking someone out of it.
  - name: Users
    description: A user of your app, taking them out of everything at once, and asking their pages.
  - name: Who is online
    description: Who of your users is online anywhere in your app.
  - name: Live streams
    description: The streams live now, one stream and who is in it, its chat as its moderators keep it, ending it, its reactions, and taking someone out of it.
  - name: Group calls
    description: The group calls going on, who is in each and what they send, muting and removing someone, and ending a call.
  - name: Usage and webhooks
    description: What your app uses now, the deliveries of its webhook, sending a batch again, and a test event.

paths:
  /wordplus/realtime/emit:
    post:
      tags: [Events]
      operationId: emit
      summary: Send an event
      description: |
        Sends one event to rooms, to users (every tab and device they have open), or both. Everyone in a room gets it,
        and a room whose `history` you give keeps it for pages that reconnect.

        The data is any JSON, up to 1 MB. Seal it first to keep it from WordPlus Cloud ([sealing](/api/sealing/)):
        the packages seal the data of every room and user by default.

        In the packages: `realtime.to( rooms ).toUser( users ).emit( event, data )`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Emit' }
            examples:
              order:
                summary: An order moving on, kept for pages that reconnect
                value: { rooms: [ 'order:42' ], event: updated, data: { status: shipped }, history: { 'order:42': [ 20, 0.003472222222222222 ] } }
              user:
                summary: A notice to one user
                value: { users: [ '42' ], event: notice, data: { text: 'Your order shipped' } }
      responses:
        '200':
          description: Sent. The ids of the events kept, by room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sent' }
              example: { ok: true, ids: { 'order:42': '1791638400000-0' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
        '413': { $ref: '#/components/responses/TooLarge' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus POST /wordplus/realtime/emit '{"rooms":["order:42"],"event":"updated","data":{"status":"shipped"}}'
        - lang: JavaScript
          label: Node
          source: |
            const { ids } = await wordplus('POST', '/wordplus/realtime/emit', { rooms: ['order:42'], event: 'updated', data: { status: 'shipped' } });
        - lang: Python
          label: Python
          source: |
            answer = wordplus("POST", "/wordplus/realtime/emit", {"rooms": ["order:42"], "event": "updated", "data": {"status": "shipped"}})
        - lang: PHP
          label: PHP
          source: |
            $answer = wordplus('POST', '/wordplus/realtime/emit', ['rooms' => ['order:42'], 'event' => 'updated', 'data' => ['status' => 'shipped']]);
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("POST", "/wordplus/realtime/emit", map[string]any{"rooms": []string{"order:42"}, "event": "updated", "data": map[string]any{"status": "shipped"}})

  /wordplus/realtime/emit/batch:
    post:
      tags: [Events]
      operationId: emitBatch
      summary: Send events in a batch
      description: |
        Sends up to 100 events in one request, each as Send an event takes it. The answer
        has the kept ids of each, in their order.

        In the packages: `realtime.batch( events )`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ events ]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/Emit' }
            example: { events: [ { rooms: [ 'product:7' ], event: price, data: { price: 12 } }, { users: [ '42' ], event: notice, data: { text: 'Price changed' } } ] }
      responses:
        '200':
          description: Sent. The ids of the events kept, by room, for each event in its order.
          content:
            application/json:
              schema:
                type: object
                required: [ ok, ids ]
                properties:
                  ok: { type: boolean, const: true }
                  ids: { type: array, items: { $ref: '#/components/schemas/KeptIds' } }
              example: { ok: true, ids: [ {}, {} ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
        '413': { $ref: '#/components/responses/TooLarge' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus POST /wordplus/realtime/emit/batch '{"events":[{"rooms":["product:7"],"event":"price","data":{"price":12}},{"users":["42"],"event":"notice","data":{"text":"Price changed"}}]}'
        - lang: JavaScript
          label: Node
          source: |
            await wordplus('POST', '/wordplus/realtime/emit/batch', { events: [
                { rooms: ['product:7'], event: 'price', data: { price: 12 } },
                { users: ['42'], event: 'notice', data: { text: 'Price changed' } },
            ] });
        - lang: Python
          label: Python
          source: |
            wordplus("POST", "/wordplus/realtime/emit/batch", {"events": [
                {"rooms": ["product:7"], "event": "price", "data": {"price": 12}},
                {"users": ["42"], "event": "notice", "data": {"text": "Price changed"}},
            ]})
        - lang: PHP
          label: PHP
          source: |
            wordplus('POST', '/wordplus/realtime/emit/batch', ['events' => [
                ['rooms' => ['product:7'], 'event' => 'price', 'data' => ['price' => 12]],
                ['users' => ['42'], 'event' => 'notice', 'data' => ['text' => 'Price changed']],
            ]]);
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("POST", "/wordplus/realtime/emit/batch", map[string]any{"events": []any{
                map[string]any{"rooms": []string{"product:7"}, "event": "price", "data": map[string]any{"price": 12}},
                map[string]any{"users": []string{"42"}, "event": "notice", "data": map[string]any{"text": "Price changed"}},
            }})

  /wordplus/realtime/rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      summary: The rooms someone is in
      description: |
        The rooms someone is in now, by name, with how many are in each: the members of a presence room, else its
        connections. With `prefix`, only the rooms whose names start with it. A page has 100 rooms, or `limit` up to 1,000,
        and `next` while there are more: send it back as `cursor`.

        In the packages: `realtime.listRooms( { prefix, cursor, limit } )`.
      parameters:
        - { name: prefix, in: query, schema: { type: string, maxLength: 200 }, description: 'Only the rooms whose names start with it.' }
        - { name: cursor, in: query, schema: { type: string }, description: 'The `next` of the page before.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: 'The rooms, by name, and how many there are in all.'
          content:
            application/json:
              schema:
                type: object
                required: [ ok, count, rooms ]
                properties:
                  ok: { type: boolean, const: true }
                  count: { type: integer, description: The rooms someone is in, all of them. }
                  rooms:
                    type: array
                    items: { $ref: '#/components/schemas/OccupiedRoom' }
                  next: { type: string, description: 'There are more: send it back as cursor.' }
              example: { ok: true, count: 2, rooms: [ { name: 'order:42', count: 1, connections: 1 }, { name: 'order:43', count: 2, connections: 3 } ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus GET '/wordplus/realtime/rooms?prefix=order%3A'
        - lang: JavaScript
          label: Node
          source: |
            const { rooms } = await wordplus('GET', '/wordplus/realtime/rooms?prefix=order%3A');
        - lang: Python
          label: Python
          source: |
            rooms = wordplus("GET", "/wordplus/realtime/rooms?prefix=order%3A")["rooms"]
        - lang: PHP
          label: PHP
          source: |
            $rooms = wordplus('GET', '/wordplus/realtime/rooms?prefix=order%3A')['rooms'];
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("GET", "/wordplus/realtime/rooms?prefix=order%3A", nil)

  /wordplus/realtime/rooms/{name}:
    get:
      tags: [Rooms]
      operationId: room
      summary: A room and its members
      description: |
        How many are in a room: the members of a presence room, else its connections. With `members=1`, the first
        1,000 members of a presence room too, each with their info as your token gave it (sealed with the room key when
        the room is sealed).

        In the packages: `realtime.in( room ).count()` and `.members()`.
      parameters:
        - $ref: '#/components/parameters/Room'
        - name: members
          in: query
          description: '`1` to list the members.'
          schema: { type: string, enum: [ '1' ] }
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema:
                type: object
                required: [ ok, count, connections ]
                properties:
                  ok: { type: boolean, const: true }
                  count: { type: integer, description: The members of a presence room, else its connections. }
                  connections: { type: integer, description: The connections in the room. }
                  members:
                    type: object
                    description: With `members=1`.
                    required: [ count, list ]
                    properties:
                      count: { type: integer }
                      list:
                        type: array
                        items:
                          type: object
                          required: [ id, info ]
                          properties:
                            id: { type: string, description: The user id. }
                            info: { description: 'What your token said of them: a value, or a sealed string.' }
                      next: { type: string, description: 'Present when there are more than 1,000.' }
              example: { ok: true, count: 2, connections: 3, members: { count: 2, list: [ { id: '34', info: 'ch:chat:34:42:1:1.AQEB…' }, { id: '42', info: 'ch:chat:34:42:1:1.AgIC…' } ] } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus GET '/wordplus/realtime/rooms/chat%3A34%3A42?members=1'
        - lang: JavaScript
          label: Node
          source: |
            const room = await wordplus('GET', `/wordplus/realtime/rooms/${encodeURIComponent('chat:34:42')}?members=1`);
        - lang: Python
          label: Python
          source: |
            from urllib.parse import quote
            room = wordplus("GET", f"/wordplus/realtime/rooms/{quote('chat:34:42', safe='')}?members=1")
        - lang: PHP
          label: PHP
          source: |
            $room = wordplus('GET', '/wordplus/realtime/rooms/'.rawurlencode('chat:34:42').'?members=1');
        - lang: Go
          label: Go
          source: |
            room, err := app.Request("GET", "/wordplus/realtime/rooms/"+url.PathEscape("chat:34:42")+"?members=1", nil)

  /wordplus/realtime/rooms/{name}/history:
    get:
      tags: [Rooms]
      operationId: roomHistory
      summary: The history of a room
      description: |
        The events a room kept, oldest first: the newest `limit`, or those before or after the id of an event. A room keeps
        its events for 5 minutes at most, for pages that reconnect: keep your own records from the webhook.

        In the packages: `realtime.in( room ).history( { before, after, limit } )`.
      parameters:
        - $ref: '#/components/parameters/Room'
        - name: before
          in: query
          description: The id of an event. Those before it.
          schema: { $ref: '#/components/schemas/EventId' }
        - name: after
          in: query
          description: The id of an event. Those after it.
          schema: { $ref: '#/components/schemas/EventId' }
        - name: limit
          in: query
          description: How many, 50 by default, 100 at most.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: A page of the history.
          content:
            application/json:
              schema:
                type: object
                required: [ ok, events, more ]
                properties:
                  ok: { type: boolean, const: true }
                  events: { type: array, items: { $ref: '#/components/schemas/KeptEvent' } }
                  more: { type: boolean, description: Whether there are older events. }
              example: { ok: true, events: [ { id: '1791638400000-0', at: 1791638400000, event: updated, data: 'ch:order:42:1:1.AQEB…' } ], more: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus GET '/wordplus/realtime/rooms/order%3A42/history?limit=20'
        - lang: JavaScript
          label: Node
          source: |
            const { events, more } = await wordplus('GET', `/wordplus/realtime/rooms/${encodeURIComponent('order:42')}/history?limit=20`);
        - lang: Python
          label: Python
          source: |
            page = wordplus("GET", f"/wordplus/realtime/rooms/{quote('order:42', safe='')}/history?limit=20")
        - lang: PHP
          label: PHP
          source: |
            $page = wordplus('GET', '/wordplus/realtime/rooms/'.rawurlencode('order:42').'/history?limit=20');
        - lang: Go
          label: Go
          source: |
            page, err := app.Request("GET", "/wordplus/realtime/rooms/"+url.PathEscape("order:42")+"/history?limit=20", nil)
    delete:
      tags: [Rooms]
      operationId: forgetHistory
      summary: Erase the history of a room
      description: |
        Erases one kept event by its id, or all of them.

        In the packages: `realtime.in( room ).forget( id )`.
      parameters:
        - $ref: '#/components/parameters/Room'
        - name: id
          in: query
          description: The id of one event. All of them without it.
          schema: { $ref: '#/components/schemas/EventId' }
      responses:
        '200':
          description: Erased.
          content:
            application/json:
              schema:
                type: object
                required: [ ok, deleted ]
                properties:
                  ok: { type: boolean, const: true }
                  deleted: { type: integer, description: How many were erased. }
              example: { ok: true, deleted: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus DELETE '/wordplus/realtime/rooms/order%3A42/history'
        - lang: JavaScript
          label: Node
          source: |
            const { deleted } = await wordplus('DELETE', `/wordplus/realtime/rooms/${encodeURIComponent('order:42')}/history`);
        - lang: Python
          label: Python
          source: |
            wordplus("DELETE", f"/wordplus/realtime/rooms/{quote('order:42', safe='')}/history")
        - lang: PHP
          label: PHP
          source: |
            wordplus('DELETE', '/wordplus/realtime/rooms/'.rawurlencode('order:42').'/history');
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("DELETE", "/wordplus/realtime/rooms/"+url.PathEscape("order:42")+"/history", nil)

  /wordplus/realtime/rooms/{name}/kick:
    post:
      tags: [Rooms]
      operationId: kick
      summary: Take someone out of a room
      description: |
        Takes every connection of a user out of the room at once, and refuses the room tokens signed for them before
        now. Move the key of the room on too ([sealing](/api/sealing/#taking-a-key-back)), so what it carries next stays
        sealed from them.

        In the packages: `realtime.in( room ).kick( user )`.
      parameters:
        - $ref: '#/components/parameters/Room'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ user ]
              properties:
                user: { $ref: '#/components/schemas/UserId' }
            example: { user: '43' }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus POST '/wordplus/realtime/rooms/chat%3A34%3A42/kick' '{"user":"43"}'
        - lang: JavaScript
          label: Node
          source: |
            await wordplus('POST', `/wordplus/realtime/rooms/${encodeURIComponent('chat:34:42')}/kick`, { user: '43' });
        - lang: Python
          label: Python
          source: |
            wordplus("POST", f"/wordplus/realtime/rooms/{quote('chat:34:42', safe='')}/kick", {"user": "43"})
        - lang: PHP
          label: PHP
          source: |
            wordplus('POST', '/wordplus/realtime/rooms/'.rawurlencode('chat:34:42').'/kick', ['user' => '43']);
        - lang: Go
          label: Go
          source: |
            _, err := app.Request("POST", "/wordplus/realtime/rooms/"+url.PathEscape("chat:34:42")+"/kick", map[string]any{"user": "43"})

  /wordplus/realtime/online:
    get:
      tags: [Who is online]
      operationId: online
      summary: Who is online
      description: |
        With `ids`, whether each of those users is online, and when the others were last seen. Without it, a page of
        the ids online now. Either way, how many are online across your app.

        A user is online while any page or app of theirs is connected, and offline 10 seconds after the last one goes.

        In the packages: `realtime.online.states( ids )`, `.has( id )`, `.count()` and `.list( { cursor, limit } )`.
      parameters:
        - name: ids
          in: query
          description: Up to 1,000 user ids, comma separated.
          schema: { type: string }
          example: '42,34'
        - name: cursor
          in: query
          description: Without `ids`, where the page starts, `0` for the first.
          schema: { type: string, default: '0' }
        - name: limit
          in: query
          description: Without `ids`, how many, 1,000 at most.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        '200':
          description: Who is online.
          content:
            application/json:
              schema:
                type: object
                required: [ ok, count ]
                properties:
                  ok: { type: boolean, const: true }
                  count: { type: integer, description: How many are online across your app. }
                  online:
                    type: array
                    description: With `ids`, each in their order.
                    items:
                      type: object
                      required: [ id, online ]
                      properties:
                        id: { type: string }
                        online: { type: boolean }
                        at: { type: integer, description: 'Offline: when they were last seen, in milliseconds.' }
                  ids: { type: array, items: { type: string }, description: Without `ids`, those online on this page. }
                  next: { type: string, description: 'Without `ids`, the cursor of the next page, `0` after the last.' }
              examples:
                ids:
                  summary: With ids
                  value: { ok: true, count: 2, online: [ { id: '42', online: true }, { id: '99', online: false, at: 1791638400000 } ] }
                page:
                  summary: A page
                  value: { ok: true, count: 2, ids: [ '34', '42' ], next: '0' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus GET '/wordplus/realtime/online?ids=42,34'
        - lang: JavaScript
          label: Node
          source: |
            const { online, count } = await wordplus('GET', '/wordplus/realtime/online?ids=42,34');
        - lang: Python
          label: Python
          source: |
            answer = wordplus("GET", "/wordplus/realtime/online?ids=42,34")
        - lang: PHP
          label: PHP
          source: |
            $answer = wordplus('GET', '/wordplus/realtime/online?ids=42,34');
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("GET", "/wordplus/realtime/online?ids=42,34", nil)

  /wordplus/realtime/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: A user
      description: |
        Whether a user of your app is online, since when they were last seen when they are not, and how many of their
        connections your server vouched for are open now. A user hidden from the online list counts as offline.

        In the packages: `realtime.user( id ).get()`.
      parameters:
        - $ref: '#/components/parameters/User'
      responses:
        '200':
          description: 'The user.'
          content:
            application/json:
              schema:
                type: object
                required: [ ok, user ]
                properties:
                  ok: { type: boolean, const: true }
                  user: { $ref: '#/components/schemas/UserState' }
              example: { ok: true, user: { id: '42', online: true, connections: 2 } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus GET '/wordplus/realtime/users/42'
        - lang: JavaScript
          label: Node
          source: |
            const { user } = await wordplus('GET', '/wordplus/realtime/users/42');
        - lang: Python
          label: Python
          source: |
            user = wordplus("GET", "/wordplus/realtime/users/42")["user"]
        - lang: PHP
          label: PHP
          source: |
            $user = wordplus('GET', '/wordplus/realtime/users/42')['user'];
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("GET", "/wordplus/realtime/users/42", nil)

  /wordplus/realtime/users/{id}/disconnect:
    post:
      tags: [Users]
      operationId: disconnectUser
      summary: Take a user out of everything
      description: |
        Takes a user out of everything at once, on every connection: their pages leave every room, the realtime server
        forgets who they are and stops their calls ringing, and their group calls and live streams take them out (a host
        stays). Each page then asks your server routes for new tokens and a new identity, and the tokens signed for the user
        before now are refused, so your rules decide whether they come back: a user you signed out, whose session is gone, or
        whom you blocked does not. A page hears `signed_out`.

        The connection stays open, so the other plugins and products on it carry on.

        In the packages: `realtime.user( id ).disconnect()`.
      parameters:
        - $ref: '#/components/parameters/User'
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
