  /wordplus/realtime/users/{id}/ask:
    post:
      tags: [Users]
      operationId: askUser
      summary: Ask the pages of a user
      description: |
        Sends an event to the open pages of a user and waits for their replies. A page answers the events it chose with the
        browser `rt.answer( event, handler )`, which returns the reply. The answer comes with the first reply, or with
        `all` once `timeout` is over, with every reply by then. No page answering is no reply.

        Seal `data` with the key of the user to keep it from WordPlus Cloud ([sealing](/api/sealing/)): the pages seal their
        replies with the same key. The packages do both by default.

        In the packages: `realtime.user( id ).ask( event, data, { timeout, all } )`.
      parameters:
        - $ref: '#/components/parameters/User'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ event ]
              properties:
                event: { type: string, minLength: 1, maxLength: 200, description: 'The event the pages answer. Not one of the names kept for the rooms.' }
                data: { description: 'Any JSON, up to 1 MB, or a sealed string.' }
                timeout: { type: integer, minimum: 1000, maximum: 60000, default: 10000, description: 'How long to wait, in milliseconds.' }
                all: { type: boolean, default: false, description: 'Wait the whole timeout for every reply, not only the first.' }
            example: { event: cart, data: { why: checkout }, timeout: 5000 }
      responses:
        '200':
          description: 'The replies, in the order they came: one at most without `all`.'
          content:
            application/json:
              schema:
                type: object
                required: [ ok, replies ]
                properties:
                  ok: { type: boolean, const: true }
                  replies:
                    type: array
                    items:
                      type: object
                      required: [ data, at ]
                      properties:
                        data: { description: 'As the page replied, up to 64 KB, a sealed string when it sealed it.' }
                        at: { type: integer, description: When it came, in milliseconds. }
              example: { ok: true, replies: [ { data: { items: 3 }, at: 1791638400000 } ] }
        '400':
          description: '`bad_event`: a name kept for the rooms. `bad_request`: a timeout out of range.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refusal' }
              example: { ok: false, error: bad_event }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
        '413': { $ref: '#/components/responses/TooLarge' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus POST '/wordplus/realtime/users/42/ask' '{"event":"cart","data":{"why":"checkout"},"timeout":5000}'
        - lang: JavaScript
          label: Node
          source: |
            const { replies } = await wordplus('POST', '/wordplus/realtime/users/42/ask', { event: 'cart', data: { why: 'checkout' }, timeout: 5000 });
        - lang: Python
          label: Python
          source: |
            replies = wordplus("POST", "/wordplus/realtime/users/42/ask", {"event": "cart", "data": {"why": "checkout"}, "timeout": 5000})["replies"]
        - lang: PHP
          label: PHP
          source: |
            $replies = wordplus('POST', '/wordplus/realtime/users/42/ask', ['event' => 'cart', 'data' => ['why' => 'checkout'], 'timeout' => 5000])['replies'];
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("POST", "/wordplus/realtime/users/42/ask", map[string]any{"event": "cart", "data": map[string]any{"why": "checkout"}, "timeout": 5000})

