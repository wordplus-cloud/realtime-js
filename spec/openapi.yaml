  /wordplus/realtime/calls/{name}/permit:
    post:
      tags: [Group calls]
      operationId: permitInCall
      summary: Change what someone may do
      description: |
        Changes what someone may do in a group call while it runs: `publish` makes a listener a speaker, or a speaker a
        listener again, which takes down what they send. `subscribe` stops or starts what they get of the others. At least
        one of the two.

        It is theirs at once when they are in the call, and their page hears `permissions`. The call and room tokens
        signed for them before follow it too, so an older token cannot undo it. A token your server signs after follows
        your rule, so keep the change where the rule reads it.

        In the packages: `realtime.call( name ).permit( user, { publish, subscribe } )`.
      parameters:
        - $ref: '#/components/parameters/Call'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ user ]
              properties:
                user: { $ref: '#/components/schemas/UserId' }
                publish: { type: boolean, description: 'May send their camera, microphone and screen.' }
                subscribe: { type: boolean, description: 'Gets those of the others.' }
            example: { user: '43', publish: true }
      responses:
        '200':
          description: 'Whether they were in it.'
          content:
            application/json:
              schema:
                type: object
                required: [ ok, changed ]
                properties:
                  ok: { type: boolean, const: true }
                  changed: { type: boolean }
              example: { ok: true, changed: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
