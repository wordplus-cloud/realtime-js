          label: PHP
          source: |
            wordplus('POST', '/wordplus/realtime/calls/'.rawurlencode('meeting:7').'/end');
        - lang: Go
          label: Go
          source: |
            _, err := app.Request("POST", "/wordplus/realtime/calls/"+url.PathEscape("meeting:7")+"/end", nil)

  /wordplus/realtime/usage:
    get:
      tags: [Usage and webhooks]
      operationId: usage
      summary: What your app uses
      description: |
        The connections open now, against the connections of your plan for an app (`limit`, null on WordPress), and the
        credits of your account, a credit a minute: those of your plan left this month, those you bought, how far into the
        allowance of next month it borrowed, the allowance itself, and whether new viewers and people above the unmetered
        floor get in (`admit`).

        In the packages: `realtime.usage()`.
      responses:
        '200':
          description: 'What the app uses.'
          content:
            application/json:
              schema:
                type: object
                required: [ ok, connections, credits ]
                properties:
                  ok: { type: boolean, const: true }
                  connections:
                    type: object
                    properties:
                      now: { type: integer }
                      limit: { type: [ integer, 'null' ] }
                  credits:
                    type: [ object, 'null' ]
                    properties:
                      plan: { type: integer }
                      bought: { type: integer }
                      borrowed: { type: integer }
                      allowance: { type: integer }
                      admit: { type: boolean }
                      buy_url: { type: string, format: uri }
              example: { ok: true, connections: { now: 312, limit: 1000 }, credits: { plan: 4200, bought: 50000, borrowed: 0, allowance: 5000, admit: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus GET '/wordplus/realtime/usage'
        - lang: JavaScript
          label: Node
          source: |
            const { connections } = await wordplus('GET', '/wordplus/realtime/usage');
        - lang: Python
          label: Python
          source: |
            connections = wordplus("GET", "/wordplus/realtime/usage")["connections"]
        - lang: PHP
          label: PHP
          source: |
            $connections = wordplus('GET', '/wordplus/realtime/usage')['connections'];
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("GET", "/wordplus/realtime/usage", nil)

  /wordplus/realtime/webhooks:
    get:
      tags: [Usage and webhooks]
      operationId: webhookDeliveries
      summary: The deliveries of your webhook
      description: |
        The last 100 tries of your webhook in the last three days, the newest first. Each batch has its id and each try its
        HTTP status (0 when nothing answered, with `error`), when it is tried again (`next_at`), and whether it may be
        sent again now (`resendable`).

        In the packages: `realtime.webhooks.deliveries()`.
      responses:
        '200':
          description: 'The deliveries.'
          content:
            application/json:
              schema:
                type: object
                required: [ ok, deliveries ]
                properties:
                  ok: { type: boolean, const: true }
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
              example: { ok: true, deliveries: [ { id: 7f9c2ba4-e88f-4c1b-9a2d-5b3e6f1a0c8d, at: 1791638400000, events: 3, types: [ member.joined ], attempt: 1, status: 503, ms: 120, next_at: 1791638430000, resendable: true } ] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus GET '/wordplus/realtime/webhooks'
        - lang: JavaScript
          label: Node
          source: |
            const { deliveries } = await wordplus('GET', '/wordplus/realtime/webhooks');
        - lang: Python
          label: Python
          source: |
            deliveries = wordplus("GET", "/wordplus/realtime/webhooks")["deliveries"]
        - lang: PHP
          label: PHP
          source: |
            $deliveries = wordplus('GET', '/wordplus/realtime/webhooks')['deliveries'];
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("GET", "/wordplus/realtime/webhooks", nil)

  /wordplus/realtime/webhooks/{id}/resend:
    post:
      tags: [Usage and webhooks]
      operationId: resendWebhook
      summary: Send a batch again
      description: |
        Sends a batch your server did not take again now, the same events with the same ids. A batch is kept while it is
        tried again, and three days after the tries end.

        In the packages: `realtime.webhooks.resend( id )`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 'The id of the batch, from its delivery.' }
      responses:
        '200': { $ref: '#/components/responses/WebhookOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus POST '/wordplus/realtime/webhooks/7f9c2ba4-e88f-4c1b-9a2d-5b3e6f1a0c8d/resend'
        - lang: JavaScript
          label: Node
          source: |
            const { delivered } = await wordplus('POST', '/wordplus/realtime/webhooks/7f9c2ba4-e88f-4c1b-9a2d-5b3e6f1a0c8d/resend');
        - lang: Python
          label: Python
          source: |
            delivered = wordplus("POST", "/wordplus/realtime/webhooks/7f9c2ba4-e88f-4c1b-9a2d-5b3e6f1a0c8d/resend")["delivered"]
        - lang: PHP
          label: PHP
          source: |
            $delivered = wordplus('POST', '/wordplus/realtime/webhooks/7f9c2ba4-e88f-4c1b-9a2d-5b3e6f1a0c8d/resend')['delivered'];
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("POST", "/wordplus/realtime/webhooks/7f9c2ba4-e88f-4c1b-9a2d-5b3e6f1a0c8d/resend", nil)

  /wordplus/realtime/webhooks/test:
    post:
      tags: [Usage and webhooks]
      operationId: testWebhook
      summary: Send a test event
      description: |
        Sends one event of type `webhook.test` to your webhook now, once, to see your server take it and check its signature.

        In the packages: `realtime.webhooks.test()`.
      responses:
        '200': { $ref: '#/components/responses/WebhookOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotIncluded' }
        '404':
          description: '`no_webhook`: your app has no webhook address.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refusal' }
              example: { ok: false, error: no_webhook }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            wordplus POST '/wordplus/realtime/webhooks/test'
        - lang: JavaScript
          label: Node
          source: |
            const { delivered } = await wordplus('POST', '/wordplus/realtime/webhooks/test');
        - lang: Python
          label: Python
          source: |
            delivered = wordplus("POST", "/wordplus/realtime/webhooks/test")["delivered"]
        - lang: PHP
          label: PHP
          source: |
            $delivered = wordplus('POST', '/wordplus/realtime/webhooks/test')['delivered'];
        - lang: Go
          label: Go
          source: |
            answer, err := app.Request("POST", "/wordplus/realtime/webhooks/test", nil)

webhooks:
  events:
    post:
      tags: [Events]
      operationId: webhook
      summary: The webhook your server gets
      description: |
        WordPlus Cloud posts what happens in your app to the webhook address on your app page in your WordPlus Cloud
        account, in batches, signed as a request to the API is, with a key of its own
        ([webhooks](/api/webhooks/)). Check the signature against the body as it came, then answer 2xx. Anything else is
        tried again, later each time, for 24 hours: drop a repeat by its `id`.
      security: []
      parameters:
        - { name: X-WordPlus-Site, in: header, required: true, schema: { type: string }, description: Your app key. }
        - { name: X-WordPlus-Timestamp, in: header, required: true, schema: { type: string }, description: Unix seconds. }
        - { name: X-WordPlus-Signature, in: header, required: true, schema: { type: string }, description: 'Hex HMAC-SHA256 under the webhook key.' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ events ]
              properties:
                events: { type: array, items: { $ref: '#/components/schemas/WebhookEvent' } }
            example:
              events:
                - { id: 0b6f1c9e-8f5d-4c38-9d2b-6a1e2f3c4d5e, at: 1791638400000, type: room.occupied, room: 'order:42' }
                - { id: 7c9e6679-7425-40de-944b-e07fc1f90ae7, at: 1791638401000, type: emit, room: 'chat:34:42', event: message, data: 'ch:chat:34:42:1:1.AQEB…', from: '34', event_id: '1791638401000-0' }
      responses:
        '204': { description: Taken. Any 2xx is. }
        default: { description: 'Not taken: any other answer, or none within 10 seconds. The batch is sent again 30 seconds later, then after 2, 10 and 30 minutes, and 1, 2, 4 and 8 hours, for 24 hours at most.' }
      x-codeSamples:
        - lang: JavaScript
          label: Node
          source: |
            import { createServer } from 'node:http';
            import { webhookEvents } from './wordplus.mjs';

            createServer((req, res) => {
                let raw = '';
                req.on('data', (chunk) => (raw += chunk));
                req.on('end', async () => {
                    try {
                        for (const event of webhookEvents(req.headers, req.url, raw)) await handle(event);
                        res.writeHead(204).end();
                    } catch (error) {
                        res.writeHead(401).end();
                    }
                });
            }).listen(8080);
        - lang: Python
          label: Python
          source: |
            from wordplus import webhook_events

            @app.post("/api/realtime/webhook")
            def realtime_webhook():
                headers = {name.lower(): value for name, value in request.headers.items()}
                try:
                    events = webhook_events(headers, request.full_path.rstrip("?"), request.get_data())
                except ValueError:
                    return "", 401
                for event in events:
                    handle(event)
                return "", 204
        - lang: PHP
          label: PHP
          source: |
            require 'wordplus.php';

            $headers = array_change_key_case(getallheaders(), CASE_LOWER);
            try {
                $events = wordplus_webhook_events($headers, $_SERVER['REQUEST_URI'], file_get_contents('php://input'));
            } catch (RuntimeException $e) {
                http_response_code(401);
                exit;
            }
            foreach ($events as $event) {
                handle($event);
            }
            http_response_code(204);
        - lang: Go
          label: Go
          source: |
            http.HandleFunc("/api/realtime/webhook", func(w http.ResponseWriter, r *http.Request) {
                raw, _ := io.ReadAll(r.Body)
                events, err := app.Webhook(r.Header, r.URL.RequestURI(), raw)
                if err != nil {
                    w.WriteHeader(401)
                    return
                }
                for _, event := range events {
                    handle(event)
                }
                w.WriteHeader(204)
            })

components:
  securitySchemes:
    site:
      type: apiKey
      in: header
      name: X-WordPlus-Site
      description: Your app key, `WORDPLUS_SITE`.
    timestamp:
      type: apiKey
      in: header
      name: X-WordPlus-Timestamp
      description: The time of the request in unix seconds, within 5 minutes of the server clock.
    signature:
      type: apiKey
      in: header
      name: X-WordPlus-Signature
      description: |
        Hex HMAC-SHA256, under the publish key `HMAC-SHA256(secret, "wordplus-realtime publish v1")`, of
        `"{timestamp}\n{METHOD}\n{path with query, as sent}\n{sha256 hex of the body}"` ([signing requests](/api/signing/)).

  parameters:
    Room:
      name: name
      in: path
      required: true
      description: 'The room name, percent-encoded: `order:42` is `order%3A42`.'
      schema: { $ref: '#/components/schemas/RoomName' }
    Stream:
      name: name
      in: path
      required: true
      description: 'The stream name, percent-encoded: `show:mugs` is `show%3Amugs`.'
      schema: { type: string, pattern: '^[A-Za-z0-9\-=@,.;:]{1,128}$' }
    User:
      name: id
      in: path
      required: true
      description: 'The user id, percent-encoded.'
      schema: { $ref: '#/components/schemas/UserId' }
    Call:
      name: name
      in: path
      required: true
      description: 'The group call name, percent-encoded: `meeting:7` is `meeting%3A7`.'
      schema: { $ref: '#/components/schemas/RoomName' }
    Message:
      name: id
      in: path
      required: true
      description: 'The id of a chat message.'
      schema: { type: string, pattern: '^\d{1,20}-\d{1,20}$' }

  requestBodies:
    StreamUser:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ user ]
            properties:
              user: { type: string, pattern: '^[\w.@-]{1,64}$', description: 'The user id the stream grant named them by (`sub`).' }
          example: { user: '77' }

  responses:
    Done:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ ok ]
            properties:
              ok: { type: boolean, const: true }
          example: { ok: true }
    BadRequest:
      description: '`bad_request`, `bad_room`: the request is not one the API takes. `reserved`: an event name kept for the room itself.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
          example: { ok: false, error: bad_request }
    Unauthorized:
      description: '`missing_signature`, `stale_signature` (a clock off by more than 5 minutes), `unknown_site`, `bad_signature` (a wrong secret, or a body or path other than the one signed).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
          example: { ok: false, error: bad_signature }
    NotIncluded:
      description: '`not_included`: your plan does not include it.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
          example: { ok: false, error: not_included }
    NotIncludedOrHost:
      description: '`not_included`: your plan does not include live streams. `host`: the host is never taken out.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
          example: { ok: false, error: host }
    TooLarge:
      description: '`too_large`: data over 1 MB. `too_many`: over 1,000 rooms or users in an event, or 100 events in a batch.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
          example: { ok: false, error: too_large }
    NotFound:
      description: '`not_found`: nothing by that name or id now.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
          example: { ok: false, error: not_found }
    WebhookOutcome:
      description: 'What the webhook did with it: taken with a 2xx, or not, with its HTTP status (0 when nothing answered) and `error` (`timeout`, `unreachable`, `not_public`).'
      content:
        application/json:
          schema:
            type: object
            required: [ ok, delivered, status ]
            properties:
              ok: { type: boolean, const: true }
              delivered: { type: boolean }
              status: { type: integer }
              error: { type: string }
          example: { ok: true, delivered: true, status: 204 }

  schemas:
    RoomName:
      type: string
      pattern: '^[A-Za-z0-9_\-=@,.;:]{1,200}$'
      description: 'Up to 200 of `A-Z a-z 0-9 _ - = @ , . ; :`.'
    UserId:
      type: string
      description: A user id, up to 64 printable characters. An integer is taken as its digits, so `42` and `"42"` are one user.
    EventId:
      type: string
      pattern: '^\d{1,16}-\d{1,20}$'
    Emit:
      type: object
      required: [ event ]
      description: One event. `rooms`, `users` or both, one at least.
      properties:
        rooms:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/RoomName' }
        users:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/UserId' }
        event:
          type: string
          minLength: 1
          maxLength: 200
          description: 'Any name but those kept for the room itself: `joined`, `join`, `leave`, `count`, `error`, `kicked`, `connect`, `disconnect`, `connect_error`, `state`, `online`.'
        data:
          description: Any JSON, up to 1 MB. A sealed string to keep it from WordPlus Cloud.
        except:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: A tab that does not get it back, the browser `rt.tab` of the page whose action made the event.
        history:
          type: object
          description: 'For each of `rooms` that keeps history, `[ last, days ]`: how many of its events it keeps, up to 1,000, for how long, up to 5 minutes (0.003472222222222222 of a day).'
          additionalProperties:
            type: array
            prefixItems:
              - { type: integer, minimum: 1, maximum: 1000 }
              - { type: number }
            minItems: 2
            maxItems: 2
    KeptIds:
      type: object
      additionalProperties: { $ref: '#/components/schemas/EventId' }
      description: The id of the kept event, by room, for the rooms that keep history.
    Sent:
      type: object
      required: [ ok, ids ]
      properties:
        ok: { type: boolean, const: true }
        ids: { $ref: '#/components/schemas/KeptIds' }
    KeptEvent:
      type: object
      required: [ id, at, event, data ]
      properties:
        id: { $ref: '#/components/schemas/EventId' }
        at: { type: integer, description: When, in milliseconds. }
        event: { type: string }
        data: { description: As it was sent. }
        from: { type: string, description: 'The user a page sent it as. None for your server.' }
    Refusal:
      type: object
      required: [ ok, error ]
      properties:
        ok: { type: boolean, const: false }
        error: { type: string }
    OccupiedRoom:
      type: object
      required: [ name, count, connections ]
      properties:
        name: { $ref: '#/components/schemas/RoomName' }
        count: { type: integer, description: 'The members of a presence room, else its connections.' }
        connections: { type: integer }
    UserState:
      type: object
      required: [ id, online, connections ]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        online: { type: boolean }
        at: { type: integer, description: 'When they were last seen, in milliseconds, while offline.' }
        connections: { type: integer, description: 'Their connections your server vouched for, open now.' }
    StreamMessage:
      type: object
      required: [ id, from, text, at ]
      properties:
        id: { type: string }
        from:
          type: object
          properties:
            user: { type: [ string, 'null' ], description: 'Null for a visitor and for your app.' }
            name: { type: string }
            avatar: { type: [ string, 'null' ] }
            role: { type: string, enum: [ host, guest, viewer, app ] }
        text: { type: string }
        at: { type: integer, description: When, in milliseconds. }
    StreamNow:
      type: object
      required: [ name, state, viewers ]
      properties:
        name: { type: string }
        state: { type: string, enum: [ idle, live, ended ] }
        started_at: { type: [ integer, 'null' ] }
        ended_at: { type: [ integer, 'null' ] }
        viewers: { type: integer, description: Watching now. }
        peak: { type: integer, description: The most watching at once since it went live. }
        slow: { type: integer, description: 'Slow mode, in seconds. 0 for off.' }
        reactions: { type: boolean }
        pinned: { oneOf: [ { $ref: '#/components/schemas/StreamMessage' }, { type: 'null' } ] }
    StreamPerson:
      type: object
      required: [ user, name, role ]
      properties:
        user: { type: [ string, 'null' ] }
        name: { type: string }
        avatar: { type: [ string, 'null' ] }
        role: { type: string, enum: [ host, guest, viewer ] }
        timeout_until: { type: integer, description: 'When their timeout ends, in milliseconds, while they have one.' }
    LiveCall:
      type: object
      required: [ name, people, started_at ]
      properties:
        name: { $ref: '#/components/schemas/RoomName' }
        people: { type: integer }
        started_at: { type: integer, description: In milliseconds. }
    CallNow:
      type: object
      required: [ name, people, started_at, list ]
      properties:
        name: { $ref: '#/components/schemas/RoomName' }
        people: { type: integer }
        started_at: { type: [ integer, 'null' ], description: 'In milliseconds, null with nobody in it.' }
        list:
          type: array
          items: { $ref: '#/components/schemas/CallParticipant' }
    CallParticipant:
      type: object
      required: [ user, joined_at, camera, microphone, screen ]
      properties:
        user: { type: [ string, 'null' ] }
        joined_at: { type: integer, description: In milliseconds. }
        camera: { type: boolean, description: 'On and not muted.' }
        microphone: { type: boolean }
        screen: { type: boolean }
    WebhookDelivery:
      type: object
      required: [ id, at, events, types, attempt, status, ms, resendable ]
      properties:
        id: { type: string, format: uuid, description: 'The batch. Every try of a batch has its id.' }
        at: { type: integer, description: When it was tried, in milliseconds. }
        events: { type: integer }
        types: { type: array, items: { type: string } }
        attempt: { type: integer, description: 'Its try, from 1. 0 for a resend.' }
        status: { type: integer, description: 'The HTTP status, 0 when nothing answered.' }
        error: { type: string, enum: [ timeout, unreachable, not_public ] }
        ms: { type: integer, description: How long it took. }
        next_at: { type: integer, description: When it is tried again. }
        gave_up: { type: boolean, const: true }
        resent: { type: boolean, const: true }
        resendable: { type: boolean }
    WebhookEvent:
      type: object
      required: [ id, at, type ]
      description: |
        One thing that happened, by `type`:

        - `room.occupied`, `room.vacated`: `room`. The first one in, the last one out.
        - `member.joined`, `member.left`: `room`, `user`. In a presence room.
        - `user.online`, `user.offline`: `user`.
        - `stream.live`, `stream.ended`: `stream`, `started_at`, `ended_at` (milliseconds).
        - `call.ended`: `call`, `call_id`, `from`, `to`, `media`, `started_at`, `answered_at`, `ended_at`, `seconds`, `reason`.
          A call between two people ended, `seconds` the time talked from the answer, 0 for one never answered.
        - `group.joined`, `group.left`: `call`, `user`, `media`, `joined_at`, and on leaving `left_at` and `seconds`.
        - `stream.joined`, `stream.left`: `stream`, `user`, `role`, `watch`, `joined_at`, and on leaving `left_at` and
          `seconds`. A signed-in person only, while the stream is live: joined as they open it live or it goes live with
          them on it, left as they leave or it ends, `seconds` the live time alone.
        - `emit`: `room`, `event`, `data`, `from`, `event_id`. An event a page sent to a room whose token names it in `w`
          (the room rule `webhook`). `event_id` is the id the pages saw.
        - `webhook.test`: nothing more. Sent once when your server asks for it.
      properties:
        id: { type: string, description: The id of this webhook event, to drop a repeat. }
        at: { type: integer, description: When, in milliseconds. }
        type:
          type: string
          enum: [ room.occupied, room.vacated, member.joined, member.left, user.online, user.offline, stream.live, stream.ended, call.ended, group.joined, group.left, stream.joined, stream.left, emit, webhook.test ]
        room: { type: string }
        user: { type: [ string, integer ], description: A user id. In what people used, as your rules got it, an id of digits a number. }
        stream: { type: string }
        started_at: { type: [ integer, 'null' ] }
        ended_at: { type: [ integer, 'null' ] }
        call: { type: string, description: The name of the call, as your rules gave it. }
        call_id: { type: string }
